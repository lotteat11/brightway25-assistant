name: bw25

channels:
  - conda-forge
  - cmutel

dependencies:
  - python=3.11

  # Brightway 2.5
  - brightway25
  - ecoinvent_interface        # ecoinvent import — needs a licence
  - stats_arrays               # uncertainty distributions

  # Scientific stack
  - numpy
  - pandas
  - scipy
  - matplotlib
  - seaborn

  # Sensitivity analysis
  - salib

  # Notebooks
  - jupyterlab
  - ipykernel
  - openpyxl                   # Excel reading

# Conda setup (alternative to setup.sh):
#
#   conda env create -f environment.yml
#   conda activate bw25
#   python -m ipykernel install --user --name bw25 --display-name "Python (bw25)"
#
# Then in each notebook: Kernel -> Change Kernel -> Python (bw25)
#
# That last step is the one people skip. Creating the environment does not select it,
# and a notebook running the wrong kernel gives ModuleNotFoundError no matter how many
# times you reinstall. To check which Python a notebook is actually using:
#
#   import sys; print(sys.executable)
#
# `mamba env create -f environment.yml` is a faster drop-in if you have mamba.
#
# ---------------------------------------------------------------------------
# If you do not use conda, run `bash setup.sh` instead. It builds the same
# environment with venv and pip, registers the kernel, and creates a project
# folder for your own work. Everything here is available on PyPI.
